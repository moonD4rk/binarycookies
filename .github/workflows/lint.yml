name: Lint
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Check Go version constraint
        if: matrix.os == 'ubuntu-latest'
        run: |
          GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          if [ "$GO_VERSION" != "1.20" ]; then
            echo "::error::go.mod directive must remain 'go 1.20'"
            echo "::error::Current value: go $GO_VERSION"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  api:
    name: API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Compare with the latest v2 release
        run: |
          base=$(git tag --list 'v2.*' --sort=-v:refname | grep -v -- '-' | head -n 1)
          if [ -z "$base" ]; then
            echo "No v2 release yet; nothing to compare against."
            exit 0
          fi
          minor=$(echo "$base" | cut -d. -f2)
          # A minor version may only add API, so gorelease fails on any incompatible change.
          go run golang.org/x/exp/cmd/gorelease@latest -base="$base" -version="v2.$((minor + 1)).0"
